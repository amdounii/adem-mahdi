<div class="page">
	<div class="top">
		<h1>Détails utilisateur</h1>
	</div>

	<div class="state" *ngIf="loading">Chargement...</div>
	<div class="state error" *ngIf="!loading && error">{{ error }}</div>

	<div *ngIf="!loading && !error && utilisateur">
		<table class="detail-table">
			<tr><th>ID</th><td>{{ utilisateur.id }}</td></tr>
			<tr><th>Nom</th><td>{{ utilisateur.nom ?? '-' }}</td></tr>
			<tr><th>Email</th><td>{{ utilisateur.email ?? '-' }}</td></tr>
			<tr><th>Role</th><td>{{ utilisateur.role ?? '-' }}</td></tr>
			<tr><th>Telephone</th><td>{{ utilisateur.telephone ?? '-' }}</td></tr>
		</table>
	</div>
</div>
